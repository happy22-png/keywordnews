<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 키워드 뉴스 브리핑 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-tight">스마트 뉴스 브리핑 대시보드</h1>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <span class="text-xs bg-indigo-700/80 text-indigo-100 px-3 py-1.5 rounded-lg hidden md:inline-block">vercel.app 연동 완료</span>
                <button onclick="openSettingsModal()" class="bg-indigo-700 hover:bg-indigo-800 text-sm px-4 py-2 rounded-xl font-medium transition flex items-center gap-2 shadow-inner">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    설정 (API 키 & 키워드)
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Controls & Filter Toolbar -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-4 w-full md:w-auto">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">조회 기간 지정</label>
                    <select id="dateRangeSelect" class="bg-slate-50 border border-slate-200 text-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="1">최근 24시간</option>
                        <option value="3" selected>최근 3일</option>
                        <option value="7">최근 7일</option>
                        <option value="30">최근 30일</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 mt-5 md:mt-0">
                    <label class="flex items-center cursor-pointer text-sm font-medium text-slate-600 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                        <input type="checkbox" id="dedupToggle" checked class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 mr-2">
                        중복 뉴스 자동 제거
                    </label>
                </div>
            </div>

            <button onclick="fetchAllNews()" id="searchBtn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                뉴스 브리핑 실행
            </button>
        </div>

        <!-- Current Active Keywords Pill Bar -->
        <div class="flex items-center justify-between bg-white px-5 py-3 rounded-2xl border border-slate-100 shadow-sm">
            <div class="flex items-center gap-2 overflow-x-auto py-1" id="keywordPillsContainer">
                <!-- Dynamic Pills -->
            </div>
            <span class="text-xs text-slate-400 whitespace-nowrap pl-2">최대 5개 키워드</span>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center py-20 gap-3">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-slate-500 font-medium text-sm">실시간 구글 뉴스를 수집하고 분석 중입니다...</p>
        </div>

        <!-- Columns Grid (Up to 5 columns with vertical dividers) -->
        <div id="newsColumnsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 items-start">
            <!-- Dynamic columns inserted here -->
        </div>

        <!-- Empty state placeholder -->
        <div id="emptyState" class="bg-white rounded-2xl border border-dashed border-slate-200 p-12 text-center flex flex-col items-center justify-center gap-3">
            <svg class="w-16 h-16 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
            <h3 class="text-lg font-semibold text-slate-700">등록된 키워드가 없거나 뉴스가 검색되지 않았습니다.</h3>
            <p class="text-sm text-slate-500 max-w-md">상단의 [설정] 버튼을 눌러 관심 있는 주요 키워드(최대 5개)와 API 키를 설정한 뒤 [뉴스 브리핑 실행]을 눌러주세요.</p>
            <button onclick="openSettingsModal()" class="mt-2 bg-indigo-50 text-indigo-600 font-semibold px-4 py-2 rounded-xl text-sm hover:bg-indigo-100 transition">설정 열기</button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full overflow-hidden flex flex-col border border-slate-100">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-lg">개인 설정 및 키워드 관리</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 space-y-6 flex-1 overflow-y-auto">
                <!-- API Key Section -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">개인 Gemini API 키</label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-slate-400">입력된 키는 브라우저 로컬 스토리지에만 안전하게 저장되며 서버로 전송되지 않습니다.</p>
                </div>

                <hr class="border-slate-100">

                <!-- Keywords Configuration -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-slate-700">주요 키워드 설정 (최대 5개)</label>
                        <span id="keywordCountBadge" class="text-xs font-medium px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">0/5</span>
                    </div>
                    
                    <div class="flex gap-2">
                        <input type="text" id="newKeywordInput" placeholder="예: 인공지능, 테슬라, 부동산" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') addKeyword()">
                        <button onclick="addKeyword()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition">추가</button>
                    </div>

                    <div id="keywordTagsList" class="flex flex-wrap gap-2 pt-2">
                        <!-- Dynamic Keyword tags -->
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                <button onclick="closeSettingsModal()" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition">취소</button>
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-md">저장 및 반영</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let appState = {
            apiKey: '',
            keywords: ['인공지능', '반도체', '자율주행']
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            renderKeywordPills();
            if (appState.keywords.length > 0) {
                fetchAllNews();
            }
        });

        function loadFromStorage() {
            const savedKey = localStorage.getItem('briefing_api_key');
            const savedKeywords = localStorage.getItem('briefing_keywords');
            if (savedKey) appState.apiKey = savedKey;
            if (savedKeywords) {
                try {
                    appState.keywords = JSON.parse(savedKeywords);
                } catch(e) {}
            }
        }

        function saveToStorage() {
            localStorage.setItem('briefing_api_key', appState.apiKey);
            localStorage.setItem('briefing_keywords', JSON.stringify(appState.keywords));
        }

        // Settings Modal Controls
        function openSettingsModal() {
            document.getElementById('apiKeyInput').value = appState.apiKey;
            renderSettingsKeywordTags();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function renderSettingsKeywordTags() {
            const container = document.getElementById('keywordTagsList');
            const badge = document.getElementById('keywordCountBadge');
            badge.innerText = `${appState.keywords.length}/5`;
            
            container.innerHTML = '';
            appState.keywords.forEach((kw, index) => {
                const tag = document.createElement('div');
                tag.className = 'flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg';
                tag.innerHTML = `
                    <span>${kw}</span>
                    <button onclick="removeKeyword(${index})" class="text-slate-400 hover:text-red-600 ml-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                container.appendChild(tag);
            });
        }

        function addKeyword() {
            const input = document.getElementById('newKeywordInput');
            const val = input.value.trim();
            if (!val) return;
            if (appState.keywords.length >= 5) {
                showNotification('키워드는 최대 5개까지만 등록 가능합니다.');
                return;
            }
            if (appState.keywords.includes(val)) {
                showNotification('이미 등록된 키워드입니다.');
                return;
            }
            appState.keywords.push(val);
            input.value = '';
            renderSettingsKeywordTags();
        }

        function removeKeyword(index) {
            appState.keywords.splice(index, 1);
            renderSettingsKeywordTags();
        }

        function saveSettings() {
            const apiKeyVal = document.getElementById('apiKeyInput').value.trim();
            appState.apiKey = apiKeyVal;
            saveToStorage();
            closeSettingsModal();
            renderKeywordPills();
            fetchAllNews();
        }

        function renderKeywordPills() {
            const container = document.getElementById('keywordPillsContainer');
            container.innerHTML = '';
            if (appState.keywords.length === 0) {
                container.innerHTML = '<span class="text-sm text-slate-400">등록된 키워드가 없습니다. 설정을 진행해주세요.</span>';
                return;
            }
            appState.keywords.forEach(kw => {
                const pill = document.createElement('div');
                pill.className = 'bg-indigo-50 text-indigo-700 border border-indigo-100 font-semibold text-xs px-3 py-1.5 rounded-xl whitespace-nowrap';
                pill.innerText = `# ${kw}`;
                container.appendChild(pill);
            });
        }

        async function fetchAllNews() {
            if (appState.keywords.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('newsColumnsGrid').innerHTML = '';
                return;
            }

            const loading = document.getElementById('loadingIndicator');
            const grid = document.getElementById('newsColumnsGrid');
            const emptyState = document.getElementById('emptyState');

            loading.classList.remove('hidden');
            grid.innerHTML = '';
            emptyState.classList.add('hidden');

            const days = document.getElementById('dateRangeSelect').value;
            const removeDuplicates = document.getElementById('dedupToggle').checked;

            // Fetch news for each keyword in parallel using Gemini Search Grounding
            const promises = appState.keywords.map(keyword => fetchNewsForKeyword(keyword, days));

            try {
                const results = await Promise.all(promises);
                loading.classList.add('hidden');
                
                let allNewsCombined = [];
                results.forEach((newsList, idx) => {
                    const keyword = appState.keywords[idx];
                    let filteredList = newsList;

                    if (removeDuplicates) {
                        filteredList = filterDuplicates(newsList, allNewsCombined);
                    }
                    
                    allNewsCombined = allNewsCombined.concat(filteredList);

                    renderColumn(keyword, filteredList, idx, results.length);
                });

                if (results.every(list => list.length === 0)) {
                    emptyState.classList.remove('hidden');
                }

            } catch (err) {
                loading.classList.add('hidden');
                showNotification('뉴스 수집 중 오류가 발생했습니다: ' + err.message);
                emptyState.classList.remove('hidden');
            }
        }

        async function fetchNewsForKeyword(keyword, days) {
            const systemPrompt = `You are an expert news curator and researcher. Search for the latest major news articles about "${keyword}" within the past ${days} days using Google Search. Return a valid JSON array containing up to 6 distinct news items. Each item must have:
- "title": concise headline in Korean
- "snippet": a brief 2-sentence summary in Korean
- "publisher": media outlet name
- "date": relative or absolute date/time string
- "url": valid news URL if found or source link from search attribution`;

            const userQuery = `Find recent top news articles for "${keyword}" from the last ${days} days. Return strictly as a JSON array of objects with keys: title, snippet, publisher, date, url.`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "title": { type: "STRING" },
                                "snippet": { type: "STRING" },
                                "publisher": { type: "STRING" },
                                "date": { type: "STRING" },
                                "url": { type: "STRING" }
                            },
                            propertyOrdering: ["title", "snippet", "publisher", "date", "url"]
                        }
                    }
                }
            };

            const apiKeyToUse = appState.apiKey || "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKeyToUse}`;

            let response;
            try {
                response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Network error fetching news", e);
                return [];
            }

            if (!response.ok) {
                throw new Error(`API 오류 (${response.status}) - API 키를 확인해주세요.`);
            }

            const result = await response.json();
            const candidate = result.candidates?.[0];

            if (candidate && candidate.content?.parts?.[0]?.text) {
                const jsonText = candidate.content.parts[0].text;
                try {
                    const parsed = JSON.parse(jsonText);
                    return Array.isArray(parsed) ? parsed : [];
                } catch(e) {
                    console.error("JSON parse error", e);
                    return [];
                }
            }
            return [];
        }

        function filterDuplicates(newList, existingList) {
            return newList.filter(newItem => {
                const cleanNewTitle = newItem.title.replace(/\s+/g, '').toLowerCase();
                const isDuplicate = existingList.some(existing => {
                    const cleanExistTitle = existing.title.replace(/\s+/g, '').toLowerCase();
                    return cleanExistTitle.includes(cleanNewTitle) || cleanNewTitle.includes(cleanExistTitle);
                });
                return !isDuplicate;
            });
        }

        // Render individual keyword column with vertical separator styling
        function renderColumn(keyword, newsList, columnIndex, totalColumns) {
            const grid = document.getElementById('newsColumnsGrid');

            const colDiv = document.createElement('div');
            const borderClass = (columnIndex < totalColumns - 1) ? 'xl:border-r xl:border-slate-200 xl:pr-4' : '';
            colDiv.className = `flex flex-col bg-white rounded-2xl p-4 shadow-sm border border-slate-100 ${borderClass}`;

            let html = `
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 text-base flex items-center gap-1.5 truncate">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 inline-block"></span>
                        # ${keyword}
                    </h2>
                    <span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-medium">${newsList.length}건</span>
                </div>
                <div class="flex flex-col gap-3 flex-1 overflow-y-auto max-h-[700px]">
            `;

            if (newsList.length === 0) {
                html += `
                    <div class="py-8 text-center text-slate-400 text-xs">
                        검색된 뉴스가 없습니다.
                    </div>
                `;
            } else {
                newsList.forEach(item => {
                    const safeTitle = escapeHtml(item.title || '제목 없음');
                    const safeSnippet = escapeHtml(item.snippet || '');
                    const safePublisher = escapeHtml(item.publisher || '언론사');
                    const safeDate = escapeHtml(item.date || '');
                    const safeUrl = item.url && item.url.startsWith('http') ? item.url : '#';

                    html += `
                        <div class="bg-slate-50 hover:bg-indigo-50/40 p-3.5 rounded-xl border border-slate-200/60 transition flex flex-col justify-between gap-2 group">
                            <div>
                                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                                    <span class="font-medium text-indigo-600">${safePublisher}</span>
                                    <span>${safeDate}</span>
                                </div>
                                <a href="${safeUrl}" target="_blank" class="font-semibold text-slate-800 text-sm group-hover:text-indigo-600 transition line-clamp-2 leading-snug">
                                    ${safeTitle}
                                </a>
                                <p class="text-xs text-slate-600 mt-1.5 line-clamp-2 leading-relaxed">
                                    ${safeSnippet}
                                </p>
                            </div>
                            <div class="flex justify-end pt-1">
                                <a href="${safeUrl}" target="_blank" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                                    기사 원문보기
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            colDiv.innerHTML = html;
            grid.appendChild(colDiv);
        }

        function showNotification(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-lg z-50 transition-all duration-300';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
